services:
    public:
        build:
            context: .
            dockerfile: apps/public/Dockerfile
            target: development
        ports:
            - '3001:3000'
        environment:
            NEXT_TELEMETRY_DISABLED: '1'
            WATCHPACK_POLLING: 'true'
        volumes:
            - ./apps/public/src:/workspace/apps/public/src
            - ./apps/public/next.config.ts:/workspace/apps/public/next.config.ts

    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - '3000:3000'
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./apps/api/src:/workspace/apps/api/src
            - ./apps/api/prisma:/workspace/apps/api/prisma
            - ./apps/api/prisma.config.ts:/workspace/apps/api/prisma.config.ts

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

volumes:
    postgres_data:
