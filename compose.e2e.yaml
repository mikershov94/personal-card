services:
    postgres-e2e:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: personal_card_e2e
            POSTGRES_PASSWORD: personal_card_e2e
            POSTGRES_DB: personal_card_e2e
        ports:
            - '5433:5432'
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U personal_card_e2e -d personal_card_e2e']
            interval: 2s
            timeout: 5s
            retries: 15
            start_period: 2s
