name: ci-pipeline

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    checks:
        name: checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            DATABASE_URL: postgresql://personal_card_e2e:personal_card_e2e@localhost:5432/personal_card_e2e?schema=public

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: personal_card_e2e
                    POSTGRES_PASSWORD: personal_card_e2e
                    POSTGRES_DB: personal_card_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U personal_card_e2e -d personal_card_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter api db:generate

            - name: Check formatting
              run: pnpm format:check

            - name: Linting
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test --runInBand

            - name: Apply e2e database migrations
              run: pnpm --filter api db:migrate:e2e

            - name: E2E tests
              run: pnpm test:e2e --runInBand

            - name: Build
              run: pnpm build
