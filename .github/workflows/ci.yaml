name: ci-pipeline

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    changes:
        name: detect-changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            api: ${{ steps.filter.outputs.api }}
            public: ${{ steps.filter.outputs.public }}
            api_deploy: ${{ steps.filter.outputs.api_deploy }}
            public_deploy: ${{ steps.filter.outputs.public_deploy }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Detect changed areas
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      api:
                        - 'apps/api/**'
                        - 'docker/api-entrypoint.sh'
                        - 'scripts/run-e2e.mjs'
                        - 'compose.e2e.yaml'
                        - 'compose.yaml'
                        - 'Dockerfile'
                        - '.dockerignore'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'eslint.config.mjs'
                        - '.prettierrc'
                        - '.prettierignore'
                        - '.github/workflows/**'
                      public:
                        - 'apps/public/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'eslint.config.mjs'
                        - '.prettierrc'
                        - '.prettierignore'
                        - '.github/workflows/**'
                      api_deploy:
                        - 'apps/api/**'
                        - 'docker/api-entrypoint.sh'
                        - 'Dockerfile'
                        - '.dockerignore'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                      public_deploy:
                        - 'apps/public/**'
                        - '!apps/public/Dockerfile'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'

            - name: Prepare deployment changes
              env:
                  API_DEPLOY: ${{ steps.filter.outputs.api_deploy }}
                  PUBLIC_DEPLOY: ${{ steps.filter.outputs.public_deploy }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  mkdir deployment-changes
                  printf '{"api":%s,"public":%s,"commit_sha":"%s"}\n' \
                    "$API_DEPLOY" \
                    "$PUBLIC_DEPLOY" \
                    "$COMMIT_SHA" \
                    > deployment-changes/changes.json

            - name: Upload deployment changes
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-changes
                  path: deployment-changes/changes.json
                  if-no-files-found: error
                  retention-days: 1

    api-checks:
        name: api-checks
        needs: changes
        if: needs.changes.outputs.api == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            DATABASE_URL: postgresql://personal_card_e2e:personal_card_e2e@localhost:5432/personal_card_e2e?schema=public

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: personal_card_e2e
                    POSTGRES_PASSWORD: personal_card_e2e
                    POSTGRES_DB: personal_card_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U personal_card_e2e -d personal_card_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter api db:generate

            - name: Check formatting
              run: pnpm format:check:api

            - name: Linting
              run: pnpm lint:api

            - name: Typecheck
              run: pnpm typecheck:api

            - name: Unit tests
              run: pnpm test:api --runInBand

            - name: E2E tests
              run: pnpm test:e2e --runInBand

            - name: Build
              run: pnpm build:api

    public-checks:
        name: public-checks
        needs: changes
        if: needs.changes.outputs.public == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check:public

            - name: Linting
              run: pnpm lint:public

            - name: Typecheck
              run: pnpm typecheck:public

            - name: Frontend tests
              run: pnpm test:public
