name: cd-public

on:
    workflow_run:
        workflows:
            - ci-pipeline
        types:
            - completed

permissions:
    actions: read
    contents: read

jobs:
    changes:
        name: read-deployment-changes
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            deploy: ${{ steps.changes.outputs.deploy }}

        steps:
            - name: Download deployment changes
              uses: actions/download-artifact@v4
              with:
                  name: deployment-changes
                  path: deployment-changes
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Read deployment changes
              id: changes
              env:
                  EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from 'node:fs';

                  const changes = JSON.parse(readFileSync('deployment-changes/changes.json', 'utf8'));

                  if (changes.commit_sha !== process.env.EXPECTED_COMMIT_SHA) {
                      throw new Error('Deployment artifact commit SHA does not match the CI run.');
                  }

                  appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${changes.public === true}\n`);
                  NODE

    deploy:
        name: deploy-public
        needs: changes
        if: needs.changes.outputs.deploy == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production_public
        concurrency:
            group: production_public
            cancel-in-progress: false

        steps:
            - name: Checkout verified commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Deploy public to Timeweb
              env:
                  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
                  TIMEWEB_APP_ID: ${{ vars.TIMEWEB_APP_ID }}
                  TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
              run: node .github/scripts/timeweb-deploy.mjs

            - name: Check public health
              env:
                  HEALTH_URL: ${{ vars.HEALTH_URL }}
              run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 10 "$HEALTH_URL"
